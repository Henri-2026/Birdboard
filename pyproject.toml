[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beeref*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.png", "*.ico", "*.svg", "*.ttf"]

[project]
name = "Birdboard"
version = "1.1.0"
description = "High-performance personalized infinite reference canvas"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "Henri", email = "henri.editor@gmail.com" },
    { name = "Rebecca Breu", email = "rebecca@rbreu.de" },
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "exif>=1.3.5,<=1.6.0",
    "lxml==5.1.0",
    "pyQt6-Qt6>=6.7.0,<=6.7.0",
    "pyQt6>=6.7.0,<=6.7.0",
    "rectangle-packer>=2.0.1,<=2.0.2",
]

[project.gui-scripts]
birdboard = "beeref.__main__:main"
beeref = "beeref.__main__:main"

[project.urls]
Homepage = "https://github.com/Henri-2026/Birdboard"
Repository = "https://github.com/Henri-2026/Birdboard"
Issues = "https://github.com/Henri-2026/Birdboard/issues"
